<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fellini — Google Login Test</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f1115;
        color: #e8eaed;
      }
      .card {
        width: min(520px, 92vw);
        background: #171a21;
        border: 1px solid #2a2f3a;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 16px;
        color: #9aa3b2;
        font-size: 0.95rem;
        line-height: 1.4;
      }
      label {
        display: block;
        font-size: 0.8rem;
        color: #9aa3b2;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #2a2f3a;
        background: #0f1115;
        color: #e8eaed;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 14px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 12px 14px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 10px;
      }
      .google {
        background: #fff;
        color: #1f1f1f;
      }
      .logout {
        background: #2a2f3a;
        color: #e8eaed;
      }
      pre {
        margin: 0;
        max-height: 320px;
        overflow: auto;
        background: #0b0d11;
        border: 1px solid #2a2f3a;
        border-radius: 10px;
        padding: 12px;
        font-size: 0.78rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .ok {
        color: #7ddea5;
      }
      .err {
        color: #ff8e8e;
      }
      .meta {
        font-size: 0.8rem;
        color: #9aa3b2;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Google Login Test</h1>
      <p>
        Signs in with Firebase Google, then calls
        <code>POST /api/v1/auth/google</code> on your backend.
      </p>

      <label for="apiBase">Backend API base URL</label>
      <input
        id="apiBase"
        value="http://localhost:3000/api/v1"
        placeholder="http://localhost:3000/api/v1"
      />

      <button class="google" id="googleBtn" type="button">
        Continue with Google
      </button>
      <button class="logout" id="logoutBtn" type="button">Sign out</button>

      <div class="meta" id="status">Ready</div>
      <pre id="out">{}</pre>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyAXa8AobX3XRQQevTRFXAQOCRAQwrTTD-4",
        authDomain: "fellini-82332.firebaseapp.com",
        projectId: "fellini-82332",
        storageBucket: "fellini-82332.firebasestorage.app",
        messagingSenderId: "712027751845",
        appId: "1:712027751845:web:805b6139a3dbd1abb8544c",
        measurementId: "G-X6PMCQVSLT",
      };

      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const provider = new firebase.auth.GoogleAuthProvider();

      const statusEl = document.getElementById("status");
      const outEl = document.getElementById("out");
      const apiBaseEl = document.getElementById("apiBase");

      function setStatus(text, ok) {
        statusEl.textContent = text;
        statusEl.className =
          "meta " + (ok === true ? "ok" : ok === false ? "err" : "");
      }

      function show(data) {
        outEl.textContent = JSON.stringify(data, null, 2);
      }

      document.getElementById("googleBtn").onclick = async () => {
        try {
          setStatus("Opening Google sign-in…");
          const result = await auth.signInWithPopup(provider);
          const idToken = await result.user.getIdToken(true);

          setStatus("Calling backend /auth/google…");
          const apiBase = apiBaseEl.value.replace(/\/$/, "");
          const res = await fetch(apiBase + "/auth/google", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idToken }),
          });

          const json = await res.json();
          show({
            httpStatus: res.status,
            firebaseUser: {
              uid: result.user.uid,
              email: result.user.email,
              displayName: result.user.displayName,
            },
            backend: json,
          });

          if (!res.ok) {
            setStatus("Backend error: " + (json.message || res.status), false);
            return;
          }

          if (json?.data?.token) {
            localStorage.setItem("fellini_jwt", json.data.token);
          }

          setStatus(
            "Success — JWT saved to localStorage as fellini_jwt",
            true,
          );
        } catch (err) {
          console.error(err);
          setStatus(err.message || "Sign-in failed", false);
          show({ error: String(err.message || err) });
        }
      };

      document.getElementById("logoutBtn").onclick = async () => {
        await auth.signOut();
        localStorage.removeItem("fellini_jwt");
        setStatus("Signed out");
        show({});
      };
    </script>
  </body>
</html>
